[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.10", "cmake>=3.13"]
build-backend = "setuptools.build_meta"

[project]
name = "csplendor"
version = "0.1.0"
description = "A fast Splendor game engine for 2 players"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
    {name = "kuboyu"},
]
requires-python = ">=3.8"
keywords = ["splendor", "board-game", "game-engine", "mcts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/kuboyoo/csplendor"
Repository = "https://github.com/kuboyoo/csplendor"
Issues = "https://github.com/kuboyoo/csplendor/issues"

[project.optional-dependencies]
ml = ["torch>=1.10"]
web = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic", "httpx>=0.24,<0.28"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "fastapi>=0.100",
    "httpx>=0.24,<0.28",
    "ruff>=0.5",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["csplendor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "-m", "not performance"]
markers = [
    "performance: opt-in speed regression benchmarks",
]

[tool.coverage.run]
source = ["csplendor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
